<div class="p-2 md:p-4 dark:text-white">
  <h2
    class="text-xl font-bold mb-4 border-b border-slate-600 dark:border-slate-500 pb-2 flex items-center gap-2"
  >
    🛡️ Administrator Controls
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
    <div>
      <h3 class="font-semibold mb-2 text-slate-700 dark:text-slate-200">
        System Override
      </h3>
      <button
        (click)="toggleSystem()"
        [class.bg-red-500]="systemState.isActive"
        [class.bg-green-600]="!systemState.isActive"
        class="w-full py-3 rounded-lg font-bold shadow hover:opacity-90 transition-all cursor-pointer text-white"
      >
        {{
          systemState.isActive ? "⛔ EMERGENCY STOP" : "✅ RESUME OPERATIONS"
        }}
      </button>
      <p class="text-xs mt-2 text-slate-500 dark:text-slate-400">
        Status:
        <span
          [class.text-green-500]="systemState.isActive"
          [class.text-red-400]="!systemState.isActive"
          class="font-bold"
        >
          {{ systemState.isActive ? "System is LIVE" : "System is HALTED" }}
        </span>
      </p>
    </div>

    <div>
      <h3 class="font-semibold mb-2 text-slate-700 dark:text-slate-200">
        Safety Threshold Configuration
      </h3>
      <div class="flex gap-2">
        <input
          type="number"
          [(ngModel)]="newThreshold"
          class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white dark:bg-slate-700 font-mono focus:ring-2 focus:ring-blue-500 outline-none transition-colors"
          placeholder="e.g. 100"
        />
        <button
          (click)="updateThreshold()"
          class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-semibold cursor-pointer transition-colors"
        >
          SET
        </button>
      </div>
      <p class="text-xs mt-2 text-slate-500 dark:text-slate-400">
        Current Alert Trigger:
        <span class="text-red-500 dark:text-red-400 font-mono font-bold"
          >{{ systemState.alertThreshold }} kW</span
        >
      </p>
    </div>
  </div>
</div>
