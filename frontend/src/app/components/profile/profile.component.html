<div
  class="min-h-screen bg-slate-50 p-4 md:p-8 dark:bg-slate-900 transition-colors duration-300"
>
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center gap-4 mb-8">
      <a
        href="/dashboard"
        class="p-2 bg-white rounded-full shadow hover:bg-slate-100 dark:bg-slate-800 dark:text-white"
      >
        ⬅
      </a>
      <h1 class="text-3xl font-bold text-slate-800 dark:text-white">
        My Profile
      </h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div
        class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-center"
      >
        <div class="relative inline-block">
          <img
            [src]="avatarUrl"
            class="w-32 h-32 rounded-full bg-slate-100 mb-4 mx-auto border-4 border-blue-500"
          />
          <button
            (click)="randomizeAvatar()"
            class="absolute bottom-4 right-0 bg-slate-800 text-white p-2 rounded-full text-xs shadow hover:bg-black cursor-pointer"
            title="Randomize Look"
          >
            🎲
          </button>
        </div>

        <h2 class="text-xl font-bold text-slate-800 dark:text-white capitalize">
          {{ user.username }}
        </h2>
        <span
          class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full mt-2 uppercase font-bold tracking-wider"
        >
          {{ user.role }}
        </span>

        <div class="mt-6 border-t pt-6 dark:border-slate-600">
          <label
            class="block text-sm font-semibold text-slate-500 mb-2 dark:text-slate-400"
            >Theme Preference</label
          >
          <div class="flex justify-center gap-4">
            <button
              (click)="user.theme = 'light'; saveSettings()"
              [class.ring-2]="user.theme === 'light'"
              class="px-4 py-2 bg-slate-200 rounded text-slate-800 ring-blue-500 font-medium cursor-pointer"
            >
              ☀ Light
            </button>
            <button
              (click)="user.theme = 'dark'; saveSettings()"
              [class.ring-2]="user.theme === 'dark'"
              class="px-4 py-2 bg-slate-800 rounded text-white ring-blue-500 font-medium cursor-pointer"
            >
              🌙 Dark
            </button>
          </div>
          <button
            (click)="saveSettings()"
            class="mt-2 bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition w-full cursor-pointer"
          >
            Save
          </button>
        </div>
      </div>

      <div
        class="md:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700"
      >
        <h3 class="text-xl font-bold text-slate-800 mb-6 dark:text-white">
          Security Settings
        </h3>

        <div class="space-y-4 max-w-md">
          <div>
            <label
              class="block text-sm font-medium text-slate-700 mb-1 dark:text-slate-300"
              >Current Password</label
            >
            <input
              [(ngModel)]="passwords.current"
              type="password"
              class="w-full p-3 border rounded-lg dark:bg-slate-900 dark:border-slate-600 dark:text-white"
            />
          </div>

          <div>
            <label
              class="block text-sm font-medium text-slate-700 mb-1 dark:text-slate-300"
              >New Password</label
            >
            <input
              [(ngModel)]="passwords.new"
              type="password"
              class="w-full p-3 border rounded-lg dark:bg-slate-900 dark:border-slate-600 dark:text-white"
            />
          </div>

          <div>
            <label
              class="block text-sm font-medium text-slate-700 mb-1 dark:text-slate-300"
              >Confirm New Password</label
            >
            <input
              [(ngModel)]="passwords.confirm"
              type="password"
              class="w-full p-3 border rounded-lg dark:bg-slate-900 dark:border-slate-600 dark:text-white"
            />
          </div>

          @if (msg) {
          <div class="text-green-600 bg-green-50 p-3 rounded text-sm">
            {{ msg }}
          </div>
          } @if (errorMsg) {
          <div class="text-red-600 bg-red-50 p-3 rounded text-sm">
            {{ errorMsg }}
          </div>
          }

          <div class="pt-4">
            <button
              (click)="changePassword()"
              class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition w-full md:w-auto cursor-pointer"
            >
              Update Password
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
